name: Checks and prereleases
on:
  push:
    branches: [main, prototype/direct-launcher]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    needs: [artifacts]
    env:
      VERSION: ${{ needs.artifacts.outputs.version }}
    # The full macOS race and offline lifecycle sequence exceeds ten minutes.
    # This is the CI job budget; client request deadlines remain unchanged.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Configure qualified desktop login shell
        if: runner.os == 'macOS'
        shell: bash
        run: |
          runner_user="$(id -un)"
          sudo chsh -s /bin/zsh "$runner_user"
          test "$(/usr/bin/dscl /Search -read "/Users/$runner_user" UserShell)" = "UserShell: /bin/zsh"
      - name: Install shell used by disposable qualification
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
          test -x /bin/zsh
      - run: go test -race ./...
      - run: go vet ./...
      - run: python3 scripts/install_test.py
        if: runner.os != 'Windows'
      - uses: actions/download-artifact@v4
        with:
          name: checked-candidate
          path: dist
      - name: Native candidate installation lifecycle
        if: runner.os != 'Windows'
        run: python3 scripts/lifecycle_test.py dist "$VERSION" -v
      - name: Terminal checks with the candidate
        if: runner.os != 'Windows'
        run: |
          cp "dist/tofa_${VERSION}_$(go env GOOS)_$(go env GOARCH)" tofa
          chmod +x tofa
          python3 scripts/terminal_test.py ./tofa
      - name: Compiled launcher model picker terminal checks
        if: runner.os != 'Windows'
        run: python3 scripts/picker_test.py -v
      - name: Offline live-harness qualification checks
        if: runner.os != 'Windows'
        run: python3 scripts/live_compat_test.py -f
      - name: Offline Codex trace checks
        if: runner.os != 'Windows'
        run: python3 scripts/trace_codex_test.py -v
      - name: Offline model evaluation
        if: runner.os != 'Windows'
        run: |
          python3 scripts/model_evaluation_test.py -v
          python3 scripts/evaluation_proxy_test.py -v
          python3 scripts/desktop_evaluation_test.py -v
      - name: Offline macOS qualification lifecycle
        if: runner.os != 'Windows'
        run: python3 scripts/qualify_macos_test.py -v
      - name: Windows template CLI with controlled UTM fixtures
        if: runner.os != 'Windows'
        run: |
          python3 scripts/windows_template_test.py -v
          python3 scripts/windows_run_test.py -v
          python3 scripts/windows_desktop_test.py -v
          python3 scripts/windows_catalog_test.py -v
      - name: Parse PowerShell installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @('scripts/install.ps1','scripts/uninstall.ps1','scripts/windows_test.ps1','scripts/windows_lifecycle_test.ps1','scripts/qualify_windows_install.ps1','scripts/windows_template_root.ps1','scripts/windows_template_preflight.ps1','scripts/windows_template_stage.ps1','scripts/windows_template_wait.ps1','scripts/windows_template_user.ps1','scripts/windows_desktop_ui.ps1','scripts/windows_catalog_ui.ps1','scripts/windows_catalog_review.ps1')) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { throw ($errors | Out-String) }
          }
      - name: Offline Windows installer lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows_test.ps1
      - name: Native Windows candidate installation lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows_lifecycle_test.ps1 -Dist dist -Version $env:VERSION
      - name: Windows process ownership and discovery
        if: runner.os == 'Windows'
        run: python scripts/windows_process_test.py -v
      - name: Offline Windows qualification lifecycle
        if: runner.os == 'Windows'
        run: python scripts/qualify_windows_test.py -v
  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - id: version
        name: Validate explicit tag version
        run: |
          version=$(python3 scripts/release.py version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Offline publication and workflow checks
        run: |
          python3 scripts/release_test.py -v
          go test ./scripts
      - name: Build the candidate once
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: sh scripts/build.sh "$VERSION"
      - name: Verify complete versioned distributions
        run: python3 scripts/build_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: checked-candidate
          path: dist/
          if-no-files-found: error
  publish:
    needs: [artifacts, native]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && needs.artifacts.result == 'success' && needs.native.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: prerelease-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: checked-candidate
          path: dist
      - name: Publish verified candidate bytes
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_RESULTS: '{"artifacts":"${{ needs.artifacts.result }}","native":"${{ needs.native.result }}"}'
        run: python3 scripts/release.py publish dist
